name: One-time aligned retraining

on:
  push:
    branches: [main]
    paths:
      - "engine.js"

permissions:
  contents: write

jobs:
  retrain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run aligned experiment
        run: python training/train_q_learning.py
      - name: Commit regenerated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trained_policy.js training/outputs_aligned/
          if git diff --cached --quiet; then
            echo "No regenerated changes."
          else
            git commit -m "Regenerate aligned MODQL policy and evaluation"
            git pull --rebase origin main
            git push
          fi
