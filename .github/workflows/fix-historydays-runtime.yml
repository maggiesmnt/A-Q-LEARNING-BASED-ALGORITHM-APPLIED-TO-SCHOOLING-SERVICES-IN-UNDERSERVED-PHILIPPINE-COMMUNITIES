name: Fix historyDays runtime

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-historydays-runtime.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch engine.js
        run: >-
          python -c "from pathlib import Path; p=Path('engine.js'); s=p.read_text(encoding='utf-8'); old=' var visits={};SERVICE_IDS.forEach(function(id){visits[id]=N[id].visits30});\\n var maxL=Math.max.apply(null,SERVICE_IDS.map(function(id){return N[id].learners}));'; new=' var visits={},historyDays={};\\n SERVICE_IDS.forEach(function(id){\\n  visits[id]=N[id].visits30;\\n  historyDays[id]=N[id].days;\\n });\\n servedIds.forEach(function(id){\\n  if(historyDays[id]!==undefined)historyDays[id]=0;\\n });\\n var maxL=Math.max.apply(null,SERVICE_IDS.map(function(id){return N[id].learners}));'; assert old in s, 'Expected engine.js block not found'; p.write_text(s.replace(old,new,1),encoding='utf-8')"
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add engine.js
          git commit -m "Initialize MODQL runtime historyDays state"
          git push
